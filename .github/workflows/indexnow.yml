# After each production deploy, submits new or changed sitemap URLs to IndexNow.
# The last submitted sitemap is kept as an artifact; if it has expired, all URLs are submitted.
name: IndexNow

on: page_build

permissions:
  actions: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: github.event.build.status == 'built'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore last submitted sitemap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=indexnow-state&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > state.zip
            unzip -q state.zip
          fi
      - name: Submit new or changed URLs
        env:
          HOST: ayushdev.com
          KEY: 2a145c1a219c60261648cda1aa8bb4ae
        run: |
          cat > submit.mjs <<'SCRIPT'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';

          const { HOST, KEY } = process.env;
          const STATE_FILE = 'indexnow-state.json';
          const RETRY_DELAY_MS = Number(process.env.RETRY_DELAY_MS ?? 60000);

          const response = await fetch(`https://${HOST}/sitemap.xml`);
          if (!response.ok) throw new Error(`Sitemap returned HTTP ${response.status}`);
          const entries = Object.fromEntries(
            [...(await response.text()).matchAll(/<url>([\s\S]*?)<\/url>/g)].map(([, block]) => [
              /<loc>\s*([^<\s]+)/.exec(block)?.[1],
              /<lastmod>\s*([^<\s]+)/.exec(block)?.[1] ?? '',
            ]),
          );
          if (!Object.keys(entries).length) throw new Error('Sitemap has no URLs');

          const previous = existsSync(STATE_FILE) ? JSON.parse(readFileSync(STATE_FILE, 'utf8')) : {};
          const urlList = Object.keys(entries).filter((url) => previous[url] !== entries[url]);
          console.log(`Sitemap has ${Object.keys(entries).length} URL(s); ${Object.keys(previous).length} known from the last run.`);
          if (!urlList.length) {
            console.log('No new or changed URLs in the sitemap.');
            writeFileSync(STATE_FILE, JSON.stringify(entries));
            process.exit(0);
          }

          const body = JSON.stringify({ host: HOST, key: KEY, keyLocation: `https://${HOST}/${KEY}.txt`, urlList });
          // 200 is accepted. 202 means the key is still being validated, so the URLs may not have been taken yet.
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            const result = await fetch('https://api.indexnow.org/indexnow', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=utf-8' },
              body,
            });
            console.log(`Attempt ${attempt}: HTTP ${result.status} for ${urlList.length} URL(s)`);
            if (result.status === 200) {
              writeFileSync(STATE_FILE, JSON.stringify(entries));
              process.exit(0);
            }
            if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, RETRY_DELAY_MS));
          }
          throw new Error('IndexNow did not return HTTP 200; state not saved, so the next deploy retries.');
          SCRIPT
          node submit.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: indexnow-state
          path: indexnow-state.json
          retention-days: 90
          overwrite: true
